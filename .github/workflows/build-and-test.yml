name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore Dependencies
      run: dotnet restore StaadPro.Interop.sln

    - name: Build Solution
      run: msbuild StaadPro.Interop.sln /p:Configuration=Release /verbosity:minimal

    - name: Run Tests
      run: dotnet test tests/StaadPro.Interop.Tests/StaadPro.Interop.Tests.csproj -c Release --no-build

    - name: Pack Preview
      run: dotnet pack src/StaadPro.Interop/StaadPro.Interop.csproj -c Release --no-build -p:PackageVersion=1.0.0-preview.ci.${{ github.run_number }} -o artifacts/package

    - name: Verify Installed Package and IntelliSense Examples
      shell: pwsh
      run: ./eng/Verify-LoadPackage.ps1 -PackagePath artifacts/package/StaadPro.Interop.1.0.0-preview.ci.${{ github.run_number }}.nupkg
